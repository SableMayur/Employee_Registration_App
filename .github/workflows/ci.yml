
name: Employee App CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Validate application content
        run: |
          grep -q "Employee Registration" index.html
          grep -q "employeeForm" script.js
          echo "All validation checks passed!"
